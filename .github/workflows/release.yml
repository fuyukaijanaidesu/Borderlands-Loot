name: Publish release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (for example v1.3.0)"
        required: true
        default: "v1.3.0"
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_tag.outputs.tag_name }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Resolve release tag
        id: release_tag
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [ -n "$INPUT_TAG_NAME" ]; then
            TAG_NAME="$INPUT_TAG_NAME"
          else
            TAG_NAME="v$(tr -d '[:space:]' < VERSION)"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use semantic versioning, for example v1.3.0"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI test dependencies
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: pip install -r requirements.txt
      - name: Run parser regression tests
        run: python -m unittest tests.test_sync_lootlemon -v
      - name: Run UI tests
        run: node --test tests/app.test.cjs

  release:
    name: Package and publish
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Build portable ZIP
        env:
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
        run: |
          zip -r "Borderlands-Loot-${TAG_NAME}.zip" \
            index.html assets data/catalog.json start.bat START_HERE.md README.md \
            -x "*/__pycache__/*" "*.pyc"
          unzip -t "Borderlands-Loot-${TAG_NAME}.zip"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag_name }}
          target_commitish: main
          name: Borderlands Loot ${{ needs.validate.outputs.tag_name }}
          generate_release_notes: true
          files: Borderlands-Loot-${{ needs.validate.outputs.tag_name }}.zip
