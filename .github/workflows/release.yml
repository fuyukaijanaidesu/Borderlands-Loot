name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (for example v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Build portable source archive
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          zip -r "Borderlands-Loot-\${TAG_NAME}.zip" \
            index.html assets data/catalog.json start.bat START_HERE.md README.md \
            scripts requirements.txt tests \
            -x "*/__pycache__/*" "*.pyc"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: main
          name: Borderlands Loot ${{ inputs.tag_name }}
          generate_release_notes: true
          files: Borderlands-Loot-${{ inputs.tag_name }}.zip
