name: Sync Lootlemon catalog
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/sync-lootlemon.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sync catalog and create backup
        run: python scripts/sync_lootlemon.py
      - name: Commit catalog and backups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json backups/
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Lootlemon catalog"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
