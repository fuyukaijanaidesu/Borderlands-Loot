name: UI smoke tests
on:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/test-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install DOM test environment
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Run UI smoke tests
        run: node --test tests/app.test.cjs
